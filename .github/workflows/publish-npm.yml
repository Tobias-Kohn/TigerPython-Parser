name: Publish to npm
on:
  push:
    branches: [master]
    paths:
      - 'build.sbt'
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
jobs:
  Publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v3
      - name: Read version from build.sbt
        id: version
        run: |
          VERSION=$(grep -oP '(?<=val releaseVersion = ")[^"]+' build.sbt)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Check whether this version is already published
        id: check
        run: |
          if npm view "@tigerpython/tpparser@${{ steps.version.outputs.version }}" version >/dev/null 2>&1; then
            echo "Version ${{ steps.version.outputs.version }} is already published, skipping."
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Java and Scala
        if: steps.check.outputs.already_published == 'false'
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: 17.0.11
          java-package: jdk
          architecture: x64
      - uses: sbt/setup-sbt@v1
        if: steps.check.outputs.already_published == 'false'
      - name: Run tests
        if: steps.check.outputs.already_published == 'false'
        run: sbt test
      - name: Build release artifacts (release/*.js, release/*.mjs, package.json)
        if: steps.check.outputs.already_published == 'false'
        run: sbt makeRelease
      - name: Set up Node for publishing
        if: steps.check.outputs.already_published == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - name: Update npm for OIDC trusted publishing support
        if: steps.check.outputs.already_published == 'false'
        run: npm install -g npm@latest
      - name: Publish to npm
        if: steps.check.outputs.already_published == 'false'
        run: npm publish --access public --provenance
      - name: Create GitHub Release
        if: steps.check.outputs.already_published == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ steps.version.outputs.version }}" --title "${{ steps.version.outputs.version }}" --generate-notes
